<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F7F9F7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Рецепты">
    <title>Моя Кулинарная Книга</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        cream: { 50: '#FBFDFB', 100: '#F7F9F7', 200: '#EBF0EC', 300: '#DCE4DD' },
                        terracotta: { 50: '#F2F6F3', 100: '#E2EBE4', 500: '#738A76', 600: '#5A705D', 700: '#465848' },
                        olive: { 100: '#E5ECE6', 700: '#465848' },
                        charcoal: { 700: '#444B45', 800: '#2E342F', 900: '#1C201D' }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(42, 54, 44, 0.06)',
                        'float': '0 8px 25px -4px rgba(115, 138, 118, 0.45)',
                    }
                }
            }
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background-color: #F7F9F7; color: #1C201D; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .view-transition { animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .ingredient-checked { text-decoration: line-through; color: #9CA3AF; transition: all 0.2s ease; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-terracotta-100 selection:text-terracotta-700">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-cream-100 relative shadow-xl sm:border-x sm:border-cream-200 flex flex-col">

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="view-home" class="flex-1 flex flex-col pb-24 view-transition">
            <header class="sticky top-0 z-20 bg-cream-100/95 backdrop-blur-md px-5 pt-5 pb-3 border-b border-cream-200/70">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-2xl bg-[#E7F3E8] border border-[#CFE5D1] shadow-soft flex items-center justify-center shrink-0 overflow-hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-11 h-11">
                                <path d="M36 16 C22 16 14 38 14 58 C14 76 24 88 38 88 C52 88 60 76 60 58 C60 38 50 16 36 16 Z" fill="#4D7C3E"/>
                                <path d="M36 21 C25 21 19 40 19 58 C19 73 27 83 38 83 C49 83 55 73 55 58 C55 40 47 21 36 21 Z" fill="#C5E47C"/>
                                <circle cx="37" cy="63" r="11" fill="#8B5A2B"/>
                                <circle cx="34" cy="60" r="3" fill="#A6723E" opacity="0.7"/>
                                <path d="M29 42 Q31 39 33 42" stroke="#2D3A24" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                                <path d="M40 42 Q42 39 44 42" stroke="#2D3A24" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                                <path d="M34 46 Q36.5 49 39 46" stroke="#2D3A24" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <circle cx="27" cy="45" r="2.2" fill="#F48FB1" opacity="0.8"/>
                                <circle cx="46" cy="45" r="2.2" fill="#F48FB1" opacity="0.8"/>

                                <path d="M68 28 C57 28 49 44 49 62 C49 77 57 88 68 88 C79 88 87 77 87 62 C87 44 79 28 68 28 Z" fill="#FFFDF7" stroke="#E8DEC8" stroke-width="2"/>
                                <circle cx="68" cy="66" r="10.5" fill="#FACC15"/>
                                <circle cx="65" cy="63" r="2.8" fill="#FEF08A" opacity="0.85"/>
                                <path d="M61 48 Q63 45 65 48" stroke="#3F3B32" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                                <path d="M71 48 Q73 45 75 48" stroke="#3F3B32" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                                <path d="M66 52 Q68 54.5 70 52" stroke="#3F3B32" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <circle cx="59" cy="51" r="2.2" fill="#F48FB1" opacity="0.8"/>
                                <circle cx="77" cy="51" r="2.2" fill="#F48FB1" opacity="0.8"/>

                                <path d="M51 54 Q60 59 64 56" stroke="#3A5E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
                                <path d="M53 60 Q46 57 43 53" stroke="#D4C7AE" stroke-width="3" fill="none" stroke-linecap="round"/>
                                <path d="M52 15 C52 12 48 11 48 14 C48 11 44 12 44 15 C44 18 48 21 48 21 C48 21 52 18 52 15 Z" fill="#F43F5E"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-medium uppercase tracking-wider text-terracotta-600 mb-0.5">Личная коллекция</p>
                            <h1 class="font-serif text-2xl font-semibold text-charcoal-900">Мои рецепты</h1>
                        </div>
                    </div>
                    <button onclick="openSettingsModal()" class="p-2.5 rounded-2xl bg-white text-charcoal-700 shadow-soft border border-cream-200 hover:bg-cream-50 active:scale-95 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>

                <div class="relative mb-3">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-charcoal-700/50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Поиск по названию или ингредиенту..."
                           class="w-full pl-10 pr-9 py-2.5 bg-white border border-cream-200 rounded-2xl text-sm text-charcoal-900 placeholder-charcoal-700/45 focus:outline-none focus:border-terracotta-500 shadow-soft transition">
                    <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-charcoal-700/50 hover:text-charcoal-900">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>

                <div id="category-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
            </header>

            <main class="px-5 pt-4 flex-1">
                <div id="recipes-count" class="text-xs font-medium text-charcoal-700/60 mb-3"></div>
                <div id="recipes-grid" class="grid grid-cols-1 gap-4"></div>

                <div id="empty-state" class="hidden flex-col items-center justify-center text-center py-16 px-4">
                    <div class="w-20 h-20 rounded-full bg-terracotta-50 text-terracotta-500 flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <h3 class="font-serif text-lg font-semibold text-charcoal-900 mb-1">Рецептов пока не найдено</h3>
                    <p class="text-sm text-charcoal-700/70 max-w-xs mb-6">Нажмите на кнопку «+» внизу экрана, чтобы записать свой первый рецепт.</p>
                </div>
            </main>

            <button onclick="openCreateView()" class="fixed bottom-6 right-6 sm:right-[calc(50%-12.5rem)] z-30 w-14 h-14 rounded-full bg-terracotta-500 hover:bg-terracotta-600 text-white shadow-float flex items-center justify-center active:scale-90 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <!-- ЭКРАН ПРОСМОТРА РЕЦЕПТА -->
        <div id="view-detail" class="hidden flex-1 flex-col bg-cream-50 pb-12 view-transition">
            <div class="relative w-full h-72 bg-cream-200">
                <img id="detail-image" src="" alt="" class="w-full h-full object-cover">
                <div id="detail-placeholder" class="hidden w-full h-full bg-gradient-to-br from-terracotta-100 to-olive-100 flex flex-col items-center justify-center text-terracotta-700/60">
                    <span class="text-xs font-medium uppercase">Без фотографии</span>
                </div>
                <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-black/45 to-transparent pointer-events-none"></div>

                <div class="absolute top-4 inset-x-4 flex items-center justify-between">
                    <button onclick="showHomeView()" class="w-10 h-10 rounded-full bg-white/90 backdrop-blur-md text-charcoal-900 shadow-md flex items-center justify-center active:scale-95 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>

                    <div class="flex items-center gap-2">
                        <button id="detail-edit-btn" class="px-3.5 py-2 rounded-full bg-white/90 backdrop-blur-md text-charcoal-900 text-xs font-semibold shadow-md flex items-center gap-1.5">Изменить</button>
                        <button id="detail-delete-btn" class="w-9 h-9 rounded-full bg-white/90 backdrop-blur-md text-red-600 shadow-md flex items-center justify-center">✕</button>
                    </div>
                </div>
            </div>

            <div class="relative -mt-6 bg-cream-50 rounded-t-3xl px-5 pt-6 flex-1">
                <div class="flex flex-wrap items-center gap-2 mb-3">
                    <span id="detail-category" class="px-3 py-1 rounded-full text-xs font-semibold"></span>
                    <span id="detail-time-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-olive-100 text-olive-700">
                        <span id="detail-time"></span>
                    </span>
                </div>

                <h2 id="detail-title" class="font-serif text-2xl font-semibold text-charcoal-900 leading-snug mb-6"></h2>

                <section class="mb-7">
                    <h3 class="font-serif text-lg font-semibold text-charcoal-900 mb-3">Ингредиенты</h3>
                    <div id="detail-ingredients" class="bg-white rounded-2xl p-4 shadow-soft border border-cream-200 divide-y divide-cream-200/60"></div>
                </section>

                <section id="detail-steps-section" class="mb-7">
                    <h3 class="font-serif text-lg font-semibold text-charcoal-900 mb-3">Приготовление</h3>
                    <div id="detail-steps" class="space-y-3"></div>
                </section>

                <section id="detail-notes-section" class="mb-6 hidden">
                    <h3 class="font-serif text-lg font-semibold text-charcoal-900 mb-2">Мои заметки</h3>
                    <div class="bg-terracotta-50 border border-terracotta-100 rounded-2xl p-4 text-sm text-charcoal-800" id="detail-notes"></div>
                </section>
            </div>
        </div>

        <!-- ЭКРАН СОЗДАНИЯ / РЕДАКТИРОВАНИЯ -->
        <div id="view-form" class="hidden flex-1 flex-col bg-cream-100 pb-24 view-transition">
            <header class="sticky top-0 z-20 bg-cream-100/95 backdrop-blur-md px-5 py-4 border-b border-cream-200 flex items-center justify-between">
                <button type="button" onclick="cancelForm()" class="px-3 py-1.5 rounded-full bg-cream-200/80 hover:bg-cream-200 text-charcoal-800 text-xs font-semibold transition flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                    Назад
                </button>
                <h2 id="form-header-title" class="font-serif text-lg font-semibold text-charcoal-900">Новый рецепт</h2>
                <button type="button" onclick="saveRecipe()" class="px-4 py-1.5 rounded-full bg-terracotta-500 hover:bg-terracotta-600 text-white text-sm font-semibold shadow-sm">Сохранить</button>
            </header>

            <form id="recipe-form" class="p-5 space-y-5" onsubmit="event.preventDefault(); saveRecipe();">
                <input type="hidden" id="form-recipe-id">

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-charcoal-700 mb-2">Фотография блюда</label>
                    <div id="photo-upload-area" onclick="document.getElementById('photo-input').click()"
                         class="relative w-full h-48 rounded-2xl border-2 border-dashed border-cream-300 bg-white hover:bg-cream-50 flex flex-col items-center justify-center cursor-pointer overflow-hidden transition">
                        <img id="photo-preview" src="" alt="" class="hidden w-full h-full object-cover">
                        <div id="photo-placeholder" class="flex flex-col items-center text-center p-4">
                            <span class="text-sm font-medium text-charcoal-800">Нажмите, чтобы выбрать фото</span>
                        </div>
                        <button type="button" id="remove-photo-btn" onclick="removePhoto(event)" class="hidden absolute top-3 right-3 px-3 py-1.5 rounded-full bg-black/65 text-white text-xs">Удалить</button>
                    </div>
                    <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                </div>

                <div>
                    <label for="form-title" class="block text-xs font-semibold uppercase tracking-wider text-charcoal-700 mb-1.5">Название рецепта *</label>
                    <input type="text" id="form-title" required placeholder="Например: Сырники" class="w-full px-4 py-3 bg-white border border-cream-200 rounded-2xl text-sm focus:outline-none focus:border-terracotta-500 shadow-soft">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="form-category" class="block text-xs font-semibold uppercase tracking-wider text-charcoal-700 mb-1.5">Категория *</label>
                        <select id="form-category" class="w-full px-3.5 py-3 bg-white border border-cream-200 rounded-2xl text-sm text-charcoal-900 focus:outline-none focus:border-terracotta-500 shadow-soft cursor-pointer">
                            <option value="Завтраки">Завтраки</option>
                            <option value="Основные" selected>Основные</option>
                            <option value="Десерты">Десерты</option>
                            <option value="Выпечка">Выпечка</option>
                            <option value="Салаты">Салаты</option>
                            <option value="Супы">Супы</option>
                            <option value="Напитки">Напитки</option>
                            <option value="Соусы">Соусы</option>
                        </select>
                    </div>

                    <div>
                        <label for="form-time" class="block text-xs font-semibold uppercase tracking-wider text-charcoal-700 mb-1.5">Время готовки</label>
                        <input type="text" id="form-time" placeholder="30 мин" class="w-full px-3.5 py-3 bg-white border border-cream-200 rounded-2xl text-sm focus:outline-none focus:border-terracotta-500 shadow-soft">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-charcoal-700">Ингредиенты *</label>
                        <button type="button" onclick="addIngredientRow()" class="text-xs font-semibold text-terracotta-600">+ Добавить строку</button>
                    </div>
                    <div id="form-ingredients-list" class="space-y-2"></div>
                </div>

                <div>
                    <label for="form-steps" class="block text-xs font-semibold uppercase tracking-wider text-charcoal-700 mb-1.5">Способ приготовления</label>
                    <textarea id="form-steps" rows="5" placeholder="Опишите шаги..." class="w-full px-4 py-3 bg-white border border-cream-200 rounded-2xl text-sm focus:outline-none focus:border-terracotta-500 shadow-soft"></textarea>
                </div>

                <div>
                    <label for="form-notes" class="block text-xs font-semibold uppercase tracking-wider text-charcoal-700 mb-1.5">Заметки</label>
                    <textarea id="form-notes" rows="2" placeholder="Секреты рецепта..." class="w-full px-4 py-3 bg-white border border-cream-200 rounded-2xl text-sm focus:outline-none focus:border-terracotta-500 shadow-soft"></textarea>
                </div>
            </form>
        </div>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
    <div id="modal-settings" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-cream-50 w-full max-w-md rounded-3xl p-6 shadow-2xl border border-cream-200">
            <h3 class="font-serif text-xl font-semibold mb-4">Резервная копия</h3>
            <div class="space-y-3">
                <button onclick="exportRecipes()" class="w-full py-3 px-4 rounded-2xl bg-olive-700 text-white font-semibold text-sm">Скачать копию (JSON)</button>
                <button onclick="document.getElementById('import-file-input').click()" class="w-full py-3 px-4 rounded-2xl bg-white border border-cream-300 font-semibold text-sm">Восстановить из файла</button>
                <input type="file" id="import-file-input" accept=".json" class="hidden" onchange="importRecipes(event)">
                <button onclick="closeSettingsModal()" class="w-full py-2.5 text-xs text-charcoal-700">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО УДАЛЕНИЯ -->
    <div id="modal-confirm" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center">
            <h4 class="font-serif text-lg font-semibold mb-1">Удалить рецепт?</h4>
            <div class="grid grid-cols-2 gap-2 mt-4">
                <button onclick="closeConfirmModal()" class="py-2.5 rounded-xl bg-cream-100 text-sm font-semibold">Отмена</button>
                <button id="confirm-delete-action" class="py-2.5 rounded-xl bg-red-600 text-white text-sm font-semibold">Удалить</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
        <div id="toast-message" class="px-4 py-2 rounded-full bg-charcoal-900 text-white text-xs shadow-lg"></div>
    </div>

    <script>
        const DB_NAME = 'MyCookbookDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'recipes';
        const UNITS_LIST = ['г', 'кг', 'мл', 'л', 'шт', 'ст. л.', 'ч. л.', 'зуб.', 'пучок', 'по вкусу', 'щепотка'];

        const CATEGORY_THEMES = {
            'Завтраки': { cardBg: 'bg-[#FFFDF5]', cardBorder: 'border-[#FDE68A]', badge: 'bg-[#FEF3C7] text-[#92400E]' },
            'Основные': { cardBg: 'bg-[#F8FBF8]', cardBorder: 'border-[#D1E5D3]', badge: 'bg-[#E2EBE4] text-[#3E5241]' },
            'Десерты': { cardBg: 'bg-[#FFF9FA]', cardBorder: 'border-[#FBCFE8]', badge: 'bg-[#FCE7F3] text-[#9D174D]' },
            'Выпечка': { cardBg: 'bg-[#FFF9F5]', cardBorder: 'border-[#FED7AA]', badge: 'bg-[#FFEDD5] text-[#9A3412]' },
            'Салаты': { cardBg: 'bg-[#F6FCF9]', cardBorder: 'border-[#A7F3D0]', badge: 'bg-[#D1FAE5] text-[#065F46]' },
            'Супы': { cardBg: 'bg-[#FFF8F6]', cardBorder: 'border-[#FECACA]', badge: 'bg-[#FEE2E2] text-[#991B1B]' },
            'Напитки': { cardBg: 'bg-[#F6FAFE]', cardBorder: 'border-[#BAE6FD]', badge: 'bg-[#E0F2FE] text-[#075985]' },
            'Соусы': { cardBg: 'bg-[#FAF8FF]', cardBorder: 'border-[#DDD6FE]', badge: 'bg-[#EDE9FE] text-[#5B21B6]' }
        };

        function getCategoryTheme(cat) {
            return CATEGORY_THEMES[cat] || CATEGORY_THEMES['Основные'];
        }

        const RecipeDB = {
            db: null,
            async init() {
                return new Promise((res, rej) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    req.onsuccess = e => { this.db = e.target.result; res(this.db); };
                    req.onerror = e => rej(e.target.error);
                });
            },
            async getAll() {
                if (!this.db) await this.init();
                return new Promise(res => {
                    const tx = this.db.transaction([STORE_NAME], 'readonly');
                    const req = tx.objectStore(STORE_NAME).getAll();
                    req.onsuccess = () => res((req.result || []).sort((a, b) => b.createdAt - a.createdAt));
                });
            },
            async save(r) {
                if (!this.db) await this.init();
                return new Promise((res, rej) => {
                    const tx = this.db.transaction([STORE_NAME], 'readwrite');
                    const req = tx.objectStore(STORE_NAME).put(r);
                    req.onsuccess = () => res(r);
                    req.onerror = () => rej(req.error);
                });
            },
            async delete(id) {
                if (!this.db) await this.init();
                return new Promise((res) => {
                    const tx = this.db.transaction([STORE_NAME], 'readwrite');
                    const req = tx.objectStore(STORE_NAME).delete(id);
                    req.onsuccess = () => res();
                });
            },
            async clearAndBulkInsert(arr) {
                if (!this.db) await this.init();
                return new Promise(res => {
                    const tx = this.db.transaction([STORE_NAME], 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.clear();
                    arr.forEach(r => store.put(r));
                    tx.oncomplete = () => res();
                });
            }
        };

        let allRecipes = [];
        let selectedCategory = 'Все';
        let searchQuery = '';
        let currentPhotoBase64 = '';
        let currentViewingId = null;
        const DEFAULT_CATEGORIES = ['Все', 'Завтраки', 'Основные', 'Десерты', 'Выпечка', 'Салаты', 'Супы', 'Напитки', 'Соусы'];

        async function initApp() {
            try {
                await RecipeDB.init();
                allRecipes = await RecipeDB.getAll();
                if (allRecipes.length === 0 && !localStorage.getItem('cookbook_init_v3')) {
                    await RecipeDB.save({
                        id: 'sample-1', title: 'Нежные сырники', category: 'Завтраки', time: '25 мин', image: '',
                        ingredients: [{ name: 'Творог', amount: '400', unit: 'г' }, { name: 'Яйцо', amount: '1', unit: 'шт' }],
                        steps: ['Смешать и обжарить.'], notes: 'Подавать теплыми.', createdAt: Date.now()
                    });
                    localStorage.setItem('cookbook_init_v3', 'true');
                    allRecipes = await RecipeDB.getAll();
                }
                renderCategories();
                renderRecipes();
                document.getElementById('search-input').addEventListener('input', e => {
                    searchQuery = e.target.value.trim().toLowerCase();
                    document.getElementById('clear-search-btn').classList.toggle('hidden', !searchQuery);
                    renderRecipes();
                });
            } catch (e) { console.error(e); }
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            renderRecipes();
        }

        function renderCategories() {
            const container = document.getElementById('category-filters');
            const customCats = allRecipes.map(r => r.category).filter(Boolean);
            const uniqueCategories = Array.from(new Set([...DEFAULT_CATEGORIES, ...customCats]));
            if (!uniqueCategories.includes(selectedCategory)) selectedCategory = 'Все';

            container.innerHTML = uniqueCategories.map(cat => {
                const isActive = cat === selectedCategory;
                const activeClasses = isActive ? 'bg-terracotta-600 text-white shadow-xs' : 'bg-white text-charcoal-700 border border-cream-200';
                return `<button onclick="selectCategory('${escapeHtml(cat)}')" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition active:scale-95 ${activeClasses}">${escapeHtml(cat)}</button>`;
            }).join('');
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderRecipes();
        }

        function renderRecipes() {
            const grid = document.getElementById('recipes-grid');
            const emptyState = document.getElementById('empty-state');
            const countLabel = document.getElementById('recipes-count');

            const filtered = allRecipes.filter(recipe => {
                const matchesCategory = selectedCategory === 'Все' || recipe.category === selectedCategory;
                if (!searchQuery) return matchesCategory;
                return matchesCategory && (recipe.title.toLowerCase().includes(searchQuery) || (recipe.ingredients || []).some(i => i.name.toLowerCase().includes(searchQuery)));
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden'); emptyState.classList.add('flex');
                countLabel.textContent = '';
                return;
            }

            emptyState.classList.add('hidden'); emptyState.classList.remove('flex');
            countLabel.textContent = `Найдено рецептов: ${filtered.length}`;

            grid.innerHTML = filtered.map(recipe => {
                const theme = getCategoryTheme(recipe.category);
                return `
                    <article onclick="openDetailView('${recipe.id}')" class="${theme.cardBg} ${theme.cardBorder} rounded-3xl overflow-hidden shadow-soft border flex items-stretch cursor-pointer active:scale-[0.98] transition">
                        <div class="w-28 sm:w-32 shrink-0 bg-cream-200 relative overflow-hidden flex items-center justify-center text-xs text-charcoal-700/50">
                            ${recipe.image ? `<img src="${recipe.image}" class="w-full h-full object-cover">` : '🥗'}
                        </div>
                        <div class="p-3.5 flex-1 flex flex-col justify-between min-w-0">
                            <div>
                                <div class="flex items-center justify-between gap-2 mb-1.5">
                                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold truncate ${theme.badge}">${escapeHtml(recipe.category || 'Основные')}</span>
                                    ${recipe.time ? `<span class="text-[11px] text-charcoal-700/65">${escapeHtml(recipe.time)}</span>` : ''}
                                </div>
                                <h3 class="font-serif text-base font-semibold text-charcoal-900 leading-snug line-clamp-2 mb-1.5">${escapeHtml(recipe.title)}</h3>
                            </div>
                            <p class="text-xs text-charcoal-700/60">${(recipe.ingredients || []).length} ингредиентов</p>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function switchView(viewId) {
            ['view-home', 'view-detail', 'view-form'].forEach(id => {
                const el = document.getElementById(id);
                if (id === viewId) { el.classList.remove('hidden'); el.classList.add('flex'); }
                else { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function showHomeView() {
            currentViewingId = null;
            switchView('view-home');
            renderCategories();
            renderRecipes();
        }

        function openDetailView(id) {
            const recipe = allRecipes.find(r => r.id === id);
            if (!recipe) return;
            currentViewingId = id;
            const theme = getCategoryTheme(recipe.category);

            const imgEl = document.getElementById('detail-image');
            const placeholderEl = document.getElementById('detail-placeholder');
            if (recipe.image) { imgEl.src = recipe.image; imgEl.classList.remove('hidden'); placeholderEl.classList.add('hidden'); }
            else { imgEl.classList.add('hidden'); placeholderEl.classList.remove('hidden'); }

            const catBadge = document.getElementById('detail-category');
            catBadge.textContent = recipe.category || 'Основные';
            catBadge.className = `px-3 py-1 rounded-full text-xs font-semibold ${theme.badge}`;

            document.getElementById('detail-title').textContent = recipe.title;
            document.getElementById('detail-time').textContent = recipe.time || '';
            document.getElementById('detail-time-badge').classList.toggle('hidden', !recipe.time);

            document.getElementById('detail-ingredients').innerHTML = (recipe.ingredients || []).map(ing => `
                <label class="flex items-center justify-between py-2.5 first:pt-0 last:pb-0 cursor-pointer select-none">
                    <div class="flex items-center gap-3 pr-3">
                        <input type="checkbox" onchange="toggleCheck(this)" class="w-4 h-4 rounded border-cream-300 text-terracotta-500 cursor-pointer">
                        <span class="text-sm text-charcoal-800">${escapeHtml(ing.name)}</span>
                    </div>
                    <span class="text-sm text-right font-semibold text-terracotta-700 bg-terracotta-50 px-2 py-0.5 rounded-lg">${escapeHtml(ing.amount || '')} ${escapeHtml(ing.unit || '')}</span>
                </label>
            `).join('');

            const stepsArr = Array.isArray(recipe.steps) ? recipe.steps.filter(s => s.trim()) : (recipe.steps || '').split('\n').filter(s => s.trim());
            const stepsSec = document.getElementById('detail-steps-section');
            if (stepsArr.length > 0) {
                stepsSec.classList.remove('hidden');
                document.getElementById('detail-steps').innerHTML = stepsArr.map((s, i) => `
                    <div class="bg-white rounded-2xl p-4 shadow-soft border border-cream-200 flex gap-3.5">
                        <span class="w-6 h-6 rounded-full bg-terracotta-100 text-terracotta-700 text-xs font-bold flex items-center justify-center shrink-0">${i + 1}</span>
                        <p class="text-sm text-charcoal-800 leading-relaxed">${escapeHtml(s)}</p>
                    </div>
                `).join('');
            } else { stepsSec.classList.add('hidden'); }

            const notesSec = document.getElementById('detail-notes-section');
            if (recipe.notes && recipe.notes.trim()) {
                document.getElementById('detail-notes').textContent = recipe.notes;
                notesSec.classList.remove('hidden');
            } else { notesSec.classList.add('hidden'); }

            document.getElementById('detail-edit-btn').onclick = () => openEditView(recipe.id);
            document.getElementById('detail-delete-btn').onclick = () => confirmDelete(recipe.id);
            switchView('view-detail');
        }

        function toggleCheck(cb) {
            cb.closest('label').classList.toggle('opacity-50', cb.checked);
            cb.closest('label').querySelector('span').classList.toggle('ingredient-checked', cb.checked);
        }

        function openCreateView() {
            document.getElementById('form-header-title').textContent = 'Новый рецепт';
            document.getElementById('form-recipe-id').value = '';
            document.getElementById('form-title').value = '';
            document.getElementById('form-category').value = selectedCategory !== 'Все' ? selectedCategory : 'Основные';
            document.getElementById('form-time').value = '';
            document.getElementById('form-steps').value = '';
            document.getElementById('form-notes').value = '';
            resetPhoto();
            document.getElementById('form-ingredients-list').innerHTML = '';
            addIngredientRow(); addIngredientRow(); addIngredientRow();
            switchView('view-form');
        }

        function openEditView(id) {
            const recipe = allRecipes.find(r => r.id === id);
            if (!recipe) return;
            document.getElementById('form-header-title').textContent = 'Редактировать';
            document.getElementById('form-recipe-id').value = recipe.id;
            document.getElementById('form-title').value = recipe.title;
            document.getElementById('form-category').value = recipe.category || 'Основные';
            document.getElementById('form-time').value = recipe.time || '';
            document.getElementById('form-notes').value = recipe.notes || '';
            document.getElementById('form-steps').value = Array.isArray(recipe.steps) ? recipe.steps.join('\n') : (recipe.steps || '');

            if (recipe.image) { currentPhotoBase64 = recipe.image; showPhotoPreview(recipe.image); }
            else { resetPhoto(); }

            const list = document.getElementById('form-ingredients-list');
            list.innerHTML = '';
            (recipe.ingredients || [{name: '', amount: '', unit: 'г'}]).forEach(i => addIngredientRow(i));
            switchView('view-form');
        }

        function cancelForm() {
            if (currentViewingId) openDetailView(currentViewingId);
            else showHomeView();
        }

        function addIngredientRow(data = { name: '', amount: '', unit: 'г' }) {
            const list = document.getElementById('form-ingredients-list');
            const row = document.createElement('div');
            row.className = 'ingredient-row grid grid-cols-12 gap-1.5 items-center';
            row.innerHTML = `
                <div class="col-span-5"><input type="text" value="${escapeHtml(data.name || '')}" placeholder="Продукт" class="ing-name w-full px-3 py-2.5 bg-white border border-cream-200 rounded-xl text-sm"></div>
                <div class="col-span-3"><input type="text" inputmode="decimal" value="${escapeHtml(data.amount || '')}" placeholder="Кол-во" class="ing-amount w-full px-3 py-2.5 bg-white border border-cream-200 rounded-xl text-sm text-center"></div>
                <div class="col-span-3">
                    <select class="ing-unit w-full px-2 py-2.5 bg-white border border-cream-200 rounded-xl text-xs cursor-pointer">
                        ${UNITS_LIST.map(u => `<option value="${u}" ${data.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
                    </select>
                </div>
                <div class="col-span-1 flex justify-center"><button type="button" onclick="this.closest('.ingredient-row').remove()" class="p-2 text-charcoal-700/40 hover:text-red-500">✕</button></div>
            `;
            list.appendChild(row);
        }

        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > 800) { h = Math.round((h * 800) / w); w = 800; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    showPhotoPreview(currentPhotoBase64);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showPhotoPreview(b64) {
            document.getElementById('photo-preview').src = b64;
            document.getElementById('photo-preview').classList.remove('hidden');
            document.getElementById('photo-placeholder').classList.add('hidden');
            document.getElementById('remove-photo-btn').classList.remove('hidden');
        }

        function resetPhoto() {
            currentPhotoBase64 = '';
            document.getElementById('photo-input').value = '';
            document.getElementById('photo-preview').src = '';
            document.getElementById('photo-preview').classList.add('hidden');
            document.getElementById('photo-placeholder').classList.remove('hidden');
            document.getElementById('remove-photo-btn').classList.add('hidden');
        }

        function removePhoto(e) { e.stopPropagation(); resetPhoto(); }

        async function saveRecipe() {
            const title = document.getElementById('form-title').value.trim();
            if (!title) { showToast('Введите название'); return; }

            const ingredients = Array.from(document.querySelectorAll('.ingredient-row')).map(row => ({
                name: row.querySelector('.ing-name').value.trim(),
                amount: row.querySelector('.ing-amount').value.trim(),
                unit: row.querySelector('.ing-unit').value
            })).filter(i => i.name);

            if (ingredients.length === 0) { showToast('Добавьте ингредиенты'); return; }

            const id = document.getElementById('form-recipe-id').value || ('recipe-' + Date.now());
            const existing = allRecipes.find(r => r.id === id);

            const recipeObj = {
                id,
                title,
                category: document.getElementById('form-category').value,
                time: document.getElementById('form-time').value.trim(),
                image: currentPhotoBase64,
                ingredients,
                steps: document.getElementById('form-steps').value.trim().split('\n').filter(Boolean),
                notes: document.getElementById('form-notes').value.trim(),
                createdAt: existing ? existing.createdAt : Date.now(),
                updatedAt: Date.now()
            };

            await RecipeDB.save(recipeObj);
            allRecipes = await RecipeDB.getAll();
            showToast('Сохранено!');
            openDetailView(recipeObj.id);
        }

        function confirmDelete(id) {
            document.getElementById('modal-confirm').classList.remove('hidden');
            document.getElementById('confirm-delete-action').onclick = async () => {
                await RecipeDB.delete(id);
                allRecipes = await RecipeDB.getAll();
                closeConfirmModal();
                showHomeView();
                showToast('Удалено');
            };
        }

        function closeConfirmModal() { document.getElementById('modal-confirm').classList.add('hidden'); }
        function openSettingsModal() { document.getElementById('modal-settings').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('modal-settings').classList.add('hidden'); }

        function exportRecipes() {
            const blob = new Blob([JSON.stringify(allRecipes, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `recipes_${Date.now()}.json`;
            a.click();
            showToast('Копия скачана');
        }

        function importRecipes(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async ev => {
                try {
                    const arr = JSON.parse(ev.target.result);
                    await RecipeDB.clearAndBulkInsert(arr);
                    allRecipes = await RecipeDB.getAll();
                    closeSettingsModal();
                    showHomeView();
                    showToast('Восстановлено!');
                } catch { showToast('Ошибка файла'); }
            };
            reader.readAsText(file);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('opacity-0');
            clearTimeout(window._t);
            window._t = setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
