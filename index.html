<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои рецепты</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4">

    <div class="max-w-2xl mx-auto space-y-6">
       
        <!-- Карточка создания / редактирования рецепта -->
        <div class="bg-white shadow-lg rounded-2xl overflow-hidden">
            <header class="flex justify-between items-center px-6 py-4 bg-gray-50 border-b">
                <h1 id="form-title" class="text-xl font-bold text-gray-800">Новый рецепт</h1>
                <div class="flex gap-2">
                    <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-gray-200 text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-300 transition font-medium text-sm cursor-pointer">
                        Отмена
                    </button>
                    <button type="button" onclick="saveRecipe()" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition font-medium text-sm cursor-pointer shadow-sm">
                        Сохранить
                    </button>
                </div>
            </header>

            <form id="recipe-form" class="p-6 space-y-4" onsubmit="event.preventDefault(); saveRecipe();">
                <!-- Скрытое поле для ID при редактировании -->
                <input type="hidden" id="recipe-id" value="">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Название рецепта</label>
                    <input type="text" id="recipe-name" class="w-full rounded-xl border-gray-300 border p-3 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Например: Банановый десерт без сахара">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ингредиенты</label>
                    <textarea id="recipe-ingredients" rows="3" class="w-full rounded-xl border-gray-300 border p-3 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Список продуктов..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Приготовление / Заметки</label>
                    <textarea id="recipe-description" rows="4" class="w-full rounded-xl border-gray-300 border p-3 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Шаги приготовления или ваши комментарии..."></textarea>
                </div>
            </form>
        </div>

        <!-- Список сохраненных рецептов -->
        <div class="space-y-3">
            <h2 class="text-lg font-bold text-gray-700 px-1">Сохраненные рецепты (<span id="recipes-count">0</span>)</h2>
            <div id="recipes-list" class="space-y-3">
                <!-- Сюда автоматически подгружаются карточки рецептов -->
            </div>
        </div>

    </div>

    <!-- Всплывающее уведомление -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 text-sm font-medium">
        Готово!
    </div>

    <script>
        const STORAGE_KEY = 'my_recipes_app_v1';

        // Загружаем список при открытии страницы
        document.addEventListener('DOMContentLoaded', renderRecipes);

        // Получить все рецепты из памяти
        function getRecipes() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch (e) {
                console.error('Ошибка чтения:', e);
                return [];
            }
        }

        // Сохранить или обновить рецепт
        function saveRecipe() {
            const idInput = document.getElementById('recipe-id');
            const nameInput = document.getElementById('recipe-name');
            const ingredientsInput = document.getElementById('recipe-ingredients');
            const descInput = document.getElementById('recipe-description');

            const name = nameInput.value.trim() || 'Черновик без названия';
            const ingredients = ingredientsInput.value.trim();
            const description = descInput.value.trim();
            const existingId = idInput.value;

            const recipes = getRecipes();

            if (existingId) {
                // Режим редактирования существующего рецепта
                const index = recipes.findIndex(r => String(r.id) === String(existingId));
                if (index !== -1) {
                    recipes[index] = {
                        ...recipes[index],
                        name,
                        ingredients,
                        description,
                        updatedAt: new Date().toLocaleDateString('ru-RU')
                    };
                    showToast('Изменения сохранены!');
                }
            } else {
                // Создание нового рецепта
                const newRecipe = {
                    id: Date.now(),
                    name,
                    ingredients,
                    description,
                    createdAt: new Date().toLocaleDateString('ru-RU')
                };
                recipes.unshift(newRecipe); // Добавляем в начало списка
                showToast('Рецепт сохранен!');
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
            resetForm();
            renderRecipes();
        }

        // Загрузить рецепт в форму для редактирования
        function editRecipe(id) {
            const recipes = getRecipes();
            const recipe = recipes.find(r => String(r.id) === String(id));
            if (!recipe) return;

            document.getElementById('recipe-id').value = recipe.id;
            document.getElementById('recipe-name').value = recipe.name === 'Черновик без названия' ? '' : recipe.name;
            document.getElementById('recipe-ingredients').value = recipe.ingredients || '';
            document.getElementById('recipe-description').value = recipe.description || '';

            document.getElementById('form-title').textContent = 'Редактирование рецепта';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            // Плавно прокручиваем наверх к форме
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Удалить рецепт
        function deleteRecipe(id) {
            if (!confirm('Удалить этот рецепт?')) return;
            const recipes = getRecipes().filter(r => String(r.id) !== String(id));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
           
            // Если удалили тот, что сейчас редактируется — сбрасываем форму
            if (document.getElementById('recipe-id').value === String(id)) {
                resetForm();
            }
           
            renderRecipes();
            showToast('Рецепт удален');
        }

        // Очистить форму и вернуть в режим создания
        function resetForm() {
            document.getElementById('recipe-form').reset();
            document.getElementById('recipe-id').value = '';
            document.getElementById('form-title').textContent = 'Новый рецепт';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        // Отрисовать список всех рецептов
        function renderRecipes() {
            const list = document.getElementById('recipes-list');
            const countEl = document.getElementById('recipes-count');
            const recipes = getRecipes();

            countEl.textContent = recipes.length;

            if (recipes.length === 0) {
                list.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center text-gray-400 border border-dashed border-gray-300">
                        Пока нет сохраненных рецептов. Заполните форму выше и нажмите «Сохранить».
                    </div>
                `;
                return;
            }

            list.innerHTML = recipes.map(recipe => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                    <div class="flex justify-between items-start gap-4">
                        <div>
                            <h3 class="font-bold text-lg text-gray-800">${escapeHtml(recipe.name)}</h3>
                            <span class="text-xs text-gray-400">Дата: ${recipe.updatedAt || recipe.createdAt}</span>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button onclick="editRecipe(${recipe.id})" class="text-sm bg-amber-50 text-amber-700 hover:bg-amber-100 px-3 py-1.5 rounded-lg font-medium transition cursor-pointer">
                                Изменить
                            </button>
                            <button onclick="deleteRecipe(${recipe.id})" class="text-sm bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg font-medium transition cursor-pointer">
                                Удалить
                            </button>
                        </div>
                    </div>
                    ${recipe.ingredients ? `
                        <div class="bg-gray-50 p-3 rounded-xl text-sm text-gray-700 whitespace-pre-line">
                            <strong class="block text-xs uppercase text-gray-400 mb-1">Ингредиенты:</strong>
                            ${escapeHtml(recipe.ingredients)}
                        </div>
                    ` : ''}
                    ${recipe.description ? `
                        <div class="text-sm text-gray-600 whitespace-pre-line">
                            ${escapeHtml(recipe.description)}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Защита от поломки верстки спецсимволами
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Уведомления
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
