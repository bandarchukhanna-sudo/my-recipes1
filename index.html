<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F5F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Рецепты">
    <title>Моя Кулинарная Книга</title>
    
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Шрифт Inter и Lora для уютной типографики -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        cream: {
                            50: '#F9FBF9',
                            100: '#F2F5F3',
                            200: '#E4ECE5',
                            300: '#D2DDD4',
                        },
                        sage: {
                            50: '#F0F5F1',
                            100: '#E1ECE3',
                            200: '#C4D8C7',
                            400: '#8DAE92',
                            500: '#6B8E70',
                            600: '#547258',
                            700: '#415844',
                        },
                        terracotta: {
                            500: '#738A76',
                            600: '#5A705D',
                        },
                        charcoal: {
                            700: '#444B45',
                            800: '#2E342F',
                            900: '#1C201D',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(65, 88, 68, 0.06)',
                        'float': '0 8px 25px -4px rgba(107, 142, 112, 0.35)',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #F2F5F3;
            color: #1C201D;
            overscroll-behavior-y: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .view-transition {
            animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ingredient-checked {
            text-decoration: line-through;
            color: #9CA3AF;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-sage-200 selection:text-sage-700">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-cream-100 relative shadow-xl sm:border-x sm:border-cream-200 flex flex-col">

        <!-- ================= ГЛАВНЫЙ ЭКРАН ================= -->
        <div id="view-home" class="flex-1 flex flex-col pb-24 view-transition">
            <header class="sticky top-0 z-20 bg-cream-100/95 backdrop-blur-md px-5 pt-5 pb-3 border-b border-cream-200">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <!-- Иллюстрация: Авокадо и яйцо в обнимку -->
                        <div class="w-13 h-13 rounded-2xl bg-sage-100 border border-sage-200 shadow-soft flex items-center justify-center shrink-0 overflow-hidden p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-12 h-12 drop-shadow-xs">
                                <!-- Авокадо слева -->
                                <path d="M35 15 C20 15 12 37 12 57 C12 75 22 88 35 88 C48 88 56 75 56 57 C56 37 48 15 35 15 Z" fill="#415844"/>
                                <path d="M35 20 C23 20 17 39 17 57 C17 72 25 83 35 83 C45 83 51 72 51 57 C51 39 45 20 35 20 Z" fill="#C2D8C5"/>
                                <circle cx="35" cy="62" r="10" fill="#8C5830"/>
                                <circle cx="32" cy="59" r="2.5" fill="#A77044" opacity="0.7"/>
                                <path d="M28 42 Q30 39 32 42" stroke="#2D3A2F" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <path d="M38 42 Q40 39 42 42" stroke="#2D3A2F" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <path d="M33 46 Q35 48.5 37 46" stroke="#2D3A2F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                                <circle cx="26" cy="45" r="2" fill="#F472B6" opacity="0.8"/>
                                <circle cx="44" cy="45" r="2" fill="#F472B6" opacity="0.8"/>
                                
                                <!-- Яйцо справа в обнимку -->
                                <path d="M65 25 C55 25 48 40 48 58 C48 74 55 88 65 88 C75 88 82 74 82 58 C82 40 75 25 65 25 Z" fill="#FFFDF9" stroke="#D1DCD3" stroke-width="2"/>
                                <circle cx="65" cy="64" r="9.5" fill="#FACC15"/>
                                <path d="M59 47 Q61 44 63 47" stroke="#37413B" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <path d="M67 47 Q69 44 71 47" stroke="#37413B" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <path d="M63 51 Q65 53 67 51" stroke="#37413B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                                <circle cx="56" cy="50" r="1.8" fill="#F472B6" opacity="0.8"/>
                                <circle cx="74" cy="50" r="1.8" fill="#F472B6" opacity="0.8"/>

                                <!-- Ручки в обнимку -->
                                <path d="M48 55 Q56 61 52 68" stroke="#415844" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-medium uppercase tracking-wider text-sage-600 mb-0.5">Шалфейная коллекция</p>
                            <h1 class="font-serif text-2xl font-semibold text-charcoal-900">Мои рецепты</h1>
                        </div>
                    </div>
                    <button onclick="openSettingsModal()" aria-label="Настройки" class="p-2.5 rounded-2xl bg-white text-charcoal-700 shadow-soft border border-cream-200 hover:bg-cream-50 active:scale-95 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>

                <!-- Поиск -->
                <div class="relative mb-3">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-charcoal-700/50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Поиск по названию или ингредиенту..." 
                           class="w-full pl-10 pr-9 py-2.5 bg-white border border-cream-200 rounded-2xl text-sm text-charcoal-900 placeholder-charcoal-700/45 focus:outline-none focus:border-sage-500 shadow-soft transition">
                    <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-charcoal-700/50 hover:text-charcoal-900">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>

                <!-- Фильтры категорий -->
                <div id="category-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
            </header>

            <main class="px-5 pt-4 flex-1">
                <div id="recipes-count" class="text-xs font-medium text-charcoal-700/60 mb-3"></div>
                <div id="recipes-grid" class="grid grid-cols-1 gap-4"></div>

                <div id="empty-state" class="hidden flex-col items-center justify-center text-center py-16 px-4">
                    <div class="w-20 h-20 rounded-full bg-sage-50 text-sage-600 flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <h3 class="font-serif text-lg font-semibold text-charcoal-900 mb-1">Рецептов пока не найдено</h3>
                    <p class="text-sm text-charcoal-700/70 max-w-xs mb-6">Нажмите на кнопку «+» внизу, чтобы добавить первый рецепт (можно записать даже одно слово!).</p>
                </div>
            </main>

            <!-- Кнопка добавить (+) -->
            <button onclick="openCreateView()" aria-label="Добавить рецепт" 
                    class="fixed bottom-6 right-6 sm:right-[calc(50%-12.5rem)] z-30 w-14 h-14 rounded-full bg-sage-600 hover:bg-sage-700 text-white shadow-float flex items-center justify-center active:scale-90 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <!-- ================= ЭКРАН ПРОСМОТРА ================= -->
        <div id="view-detail" class="hidden flex-1 flex-col bg-cream-50 pb-12 view-transition">
            <div class="relative w-full h-72 bg-cream-200">
                <img id="detail-image" src="" alt="Фото блюда" class="w-full h-full object-cover">
                <div id="detail-placeholder" class="hidden w-full h-full bg-gradient-to-br from-sage-10
